substitutions:
  - description: |
      Close sidebar web panels before the session services shut down

      Panels are pinned tabs, and quitting finalizes the session here - before
      any window starts closing - so they would be restored as regular pinned
      tabs.
    preempt_function_impl:
      function_name: BrowserCloseManager::CloseBrowsers
      code: |-
        sidebar::CloseAllWebPanels();
